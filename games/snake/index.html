<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>neon snake</title>
<style>
  html, body { margin: 0; height: 100%; background: #0b0a12; overflow: hidden; touch-action: none; }
  body {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    font-family: "JetBrains Mono", ui-monospace, Menlo, monospace; color: #d8d4ea;
  }
  #hud { display: flex; gap: 24px; font-size: 14px; margin-bottom: 10px; }
  #hud b { color: #ff5fa2; }
  #hud .hi b { color: #5ff2ff; }
  canvas {
    border: 1px solid #2a2540; border-radius: 6px;
    box-shadow: 0 0 40px rgba(255, 95, 162, 0.12);
    max-width: 94vw; max-height: 78vh; image-rendering: pixelated;
  }
  #msg { margin-top: 10px; font-size: 13px; color: #7d7799; text-align: center; padding: 0 12px; }
</style>
</head>
<body>
  <div id="hud"><span>score <b id="score">0</b></span><span class="hi">best <b id="best">0</b></span></div>
  <canvas id="c" width="400" height="400"></canvas>
  <div id="msg">press any arrow key / WASD or swipe to start · space to pause</div>

<script>
  const c = document.getElementById('c');
  const ctx = c.getContext('2d');
  const N = 20, S = c.width / N;
  const scoreEl = document.getElementById('score');
  const bestEl = document.getElementById('best');
  const msg = document.getElementById('msg');

  let best = 0;
  try { best = +localStorage.getItem('neon-snake-best') || 0; } catch {}
  bestEl.textContent = best;

  let snake, dir, nextDir, food, score, running, paused, over, timer, speed;

  function reset() {
    snake = [{ x: 9, y: 10 }, { x: 8, y: 10 }, { x: 7, y: 10 }];
    dir = { x: 1, y: 0 }; nextDir = dir;
    score = 0; speed = 120; scoreEl.textContent = 0;
    running = false; paused = false; over = false;
    placeFood(); draw();
  }

  function placeFood() {
    do { food = { x: Math.floor(Math.random() * N), y: Math.floor(Math.random() * N) }; }
    while (snake.some(p => p.x === food.x && p.y === food.y));
  }

  function step() {
    dir = nextDir;
    const head = { x: (snake[0].x + dir.x + N) % N, y: (snake[0].y + dir.y + N) % N };
    if (snake.some(p => p.x === head.x && p.y === head.y)) return gameOver();
    snake.unshift(head);
    if (head.x === food.x && head.y === food.y) {
      score++; scoreEl.textContent = score;
      if (score > best) {
        best = score; bestEl.textContent = best;
        try { localStorage.setItem('neon-snake-best', best); } catch {}
      }
      placeFood();
      if (speed > 60) { speed -= 3; restartTimer(); }
    } else {
      snake.pop();
    }
    draw();
  }

  function draw() {
    ctx.fillStyle = '#0b0a12';
    ctx.fillRect(0, 0, c.width, c.height);
    // grid
    ctx.strokeStyle = 'rgba(180,140,255,0.06)';
    for (let i = 1; i < N; i++) {
      ctx.beginPath(); ctx.moveTo(i * S, 0); ctx.lineTo(i * S, c.height); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0, i * S); ctx.lineTo(c.width, i * S); ctx.stroke();
    }
    // food
    ctx.shadowBlur = 16; ctx.shadowColor = '#5ff2ff'; ctx.fillStyle = '#5ff2ff';
    ctx.beginPath(); ctx.arc(food.x * S + S / 2, food.y * S + S / 2, S / 3, 0, Math.PI * 2); ctx.fill();
    // snake
    ctx.shadowColor = '#ff5fa2';
    snake.forEach((p, i) => {
      ctx.shadowBlur = i === 0 ? 18 : 8;
      ctx.fillStyle = i === 0 ? '#ff5fa2' : `hsl(${330 - i * 2}, 100%, ${68 - Math.min(i, 20)}%)`;
      ctx.fillRect(p.x * S + 1, p.y * S + 1, S - 2, S - 2);
    });
    ctx.shadowBlur = 0;

    if (over || paused) {
      ctx.fillStyle = 'rgba(11,10,18,0.7)'; ctx.fillRect(0, 0, c.width, c.height);
      ctx.fillStyle = over ? '#ff5fa2' : '#5ff2ff';
      ctx.font = 'bold 26px monospace'; ctx.textAlign = 'center';
      ctx.fillText(over ? 'GAME OVER' : 'PAUSED', c.width / 2, c.height / 2);
    }
  }

  function restartTimer() { clearInterval(timer); timer = setInterval(step, speed); }

  function start() {
    if (over) reset();
    if (!running) { running = true; msg.textContent = 'space to pause'; restartTimer(); }
  }

  function gameOver() {
    clearInterval(timer); over = true; running = false; draw();
    msg.textContent = 'game over · press any direction to retry';
  }

  function turn(x, y) {
    if (x === -dir.x && y === -dir.y) return;
    nextDir = { x, y };
    start();
  }

  const keys = {
    ArrowUp: [0, -1], ArrowDown: [0, 1], ArrowLeft: [-1, 0], ArrowRight: [1, 0],
    w: [0, -1], s: [0, 1], a: [-1, 0], d: [1, 0],
    W: [0, -1], S: [0, 1], A: [-1, 0], D: [1, 0]
  };
  document.addEventListener('keydown', e => {
    if (keys[e.key]) { e.preventDefault(); if (!paused) turn(...keys[e.key]); }
    else if (e.key === ' ' && running) {
      e.preventDefault(); paused = !paused;
      paused ? clearInterval(timer) : restartTimer(); draw();
    }
  });

  // swipe controls
  let tx, ty;
  c.addEventListener('touchstart', e => { tx = e.touches[0].clientX; ty = e.touches[0].clientY; }, { passive: true });
  c.addEventListener('touchend', e => {
    const dx = e.changedTouches[0].clientX - tx, dy = e.changedTouches[0].clientY - ty;
    if (Math.max(Math.abs(dx), Math.abs(dy)) < 20) return;
    Math.abs(dx) > Math.abs(dy) ? turn(Math.sign(dx), 0) : turn(0, Math.sign(dy));
  }, { passive: true });

  reset();
  window.focus();
</script>
</body>
</html>
