<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2048</title>
<style>
  :root {
    --gap: 10px;
    --s: min(92px, calc((min(92vw, 74vh) - 5 * var(--gap)) / 4));
    --pink: #ff5fa2; --cyan: #5ff2ff; --muted: #7d7799; --border: #2a2540;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #0b0a12; overflow: hidden; touch-action: none; }
  body {
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px;
    font-family: "JetBrains Mono", ui-monospace, Menlo, monospace; color: #d8d4ea;
    user-select: none;
  }
  .top { width: calc(4 * var(--s) + 5 * var(--gap)); display: flex; align-items: center; gap: 10px; font-size: 13px; }
  .top .box { border: 1px solid var(--border); border-radius: 4px; padding: 4px 10px; text-align: center; }
  .top .box span { display: block; font-size: 10px; color: var(--muted); }
  .top .box b { color: var(--pink); }
  .top .box.best b { color: var(--cyan); }
  .top .title { font-weight: 700; font-size: 22px; margin-right: auto;
    background: linear-gradient(90deg, var(--pink), var(--cyan)); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .top button {
    background: none; border: 1px solid var(--border); color: #d8d4ea; font: inherit;
    padding: 6px 10px; border-radius: 4px; cursor: pointer;
  }
  .top button:hover { color: var(--pink); border-color: var(--pink); }

  .board {
    position: relative;
    width: calc(4 * var(--s) + 5 * var(--gap)); height: calc(4 * var(--s) + 5 * var(--gap));
    padding: var(--gap); border: 1px solid var(--border); border-radius: 8px;
    background: #12101d; box-shadow: 0 0 40px rgba(255, 95, 162, 0.1);
    display: grid; grid-template-columns: repeat(4, var(--s)); gap: var(--gap);
  }
  .cell { background: rgba(42, 37, 64, 0.5); border-radius: 5px; }

  .tile {
    position: absolute; left: 0; top: 0;
    width: var(--s); height: var(--s); border-radius: 5px;
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: calc(var(--s) * 0.38);
    transform: translate(calc(var(--gap) + var(--c) * (var(--s) + var(--gap))), calc(var(--gap) + var(--r) * (var(--s) + var(--gap))));
    transition: transform 110ms ease-in-out;
  }
  .tile .in { width: 100%; height: 100%; border-radius: 5px; display: flex; align-items: center; justify-content: center; }
  .tile.new .in { animation: pop-in 160ms ease-out; }
  .tile.merged .in { animation: pop 180ms ease-out; }
  @keyframes pop-in { from { transform: scale(0); } to { transform: scale(1); } }
  @keyframes pop { 50% { transform: scale(1.15); } }

  .v2    .in { background: #241f38; color: #d8d4ea; }
  .v4    .in { background: #2f2650; color: #e6defa; }
  .v8    .in { background: #6b2f6e; color: #fff; }
  .v16   .in { background: #9a2f7c; color: #fff; }
  .v32   .in { background: #c83a86; color: #fff; }
  .v64   .in { background: #ff5fa2; color: #0b0a12; box-shadow: 0 0 14px rgba(255,95,162,.5); }
  .v128  .in { background: #b48cff; color: #0b0a12; box-shadow: 0 0 16px rgba(180,140,255,.55); font-size: .85em; }
  .v256  .in { background: #7f9bff; color: #0b0a12; box-shadow: 0 0 18px rgba(127,155,255,.55); font-size: .85em; }
  .v512  .in { background: #5ff2ff; color: #0b0a12; box-shadow: 0 0 20px rgba(95,242,255,.6); font-size: .85em; }
  .v1024 .in { background: #8cff9e; color: #0b0a12; box-shadow: 0 0 22px rgba(140,255,158,.6); font-size: .7em; }
  .v2048 .in { background: #ffd76a; color: #0b0a12; box-shadow: 0 0 30px rgba(255,215,106,.8); font-size: .7em; }
  .vbig  .in { background: #fff; color: #0b0a12; box-shadow: 0 0 30px rgba(255,255,255,.7); font-size: .6em; }

  .overlay {
    position: absolute; inset: 0; border-radius: 8px; z-index: 5;
    background: rgba(11, 10, 18, 0.82);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px;
  }
  .overlay[hidden] { display: none; }
  .overlay h2 { margin: 0; font-size: 26px; }
  .overlay.lose h2 { color: var(--pink); }
  .overlay.win h2 { color: #ffd76a; }
  .overlay button {
    background: none; border: 1px solid var(--cyan); color: var(--cyan); font: inherit;
    padding: 8px 14px; border-radius: 4px; cursor: pointer;
  }
  .overlay button:hover { background: var(--cyan); color: #0b0a12; }
  .hint { font-size: 12px; color: var(--muted); }
</style>
</head>
<body>
  <div class="top">
    <span class="title">2048</span>
    <div class="box"><span>score</span><b id="score">0</b></div>
    <div class="box best"><span>best</span><b id="best">0</b></div>
    <button id="new" type="button">new</button>
  </div>
  <div class="board" id="board">
    <div class="overlay" id="overlay" hidden><h2 id="ov-msg"></h2><div id="ov-btns"></div></div>
  </div>
  <div class="hint">arrow keys / WASD or swipe · merge to 2048</div>

<script>
  const board = document.getElementById('board');
  const scoreEl = document.getElementById('score');
  const bestEl = document.getElementById('best');
  const overlay = document.getElementById('overlay');
  for (let i = 0; i < 16; i++) board.insertAdjacentHTML('afterbegin', '<div class="cell"></div>');

  let tiles, score, won, keepGoing, busy, nextId = 1;
  let best = 0;
  try { best = +localStorage.getItem('neon-2048-best') || 0; } catch {}
  bestEl.textContent = best;

  function cls(v) { return 'tile ' + (v > 2048 ? 'vbig' : 'v' + v); }

  function addTile(t) {
    const el = document.createElement('div');
    el.className = cls(t.v) + ' new';
    el.innerHTML = '<div class="in"></div>';
    el.firstChild.textContent = t.v;
    place(el, t);
    board.appendChild(el);
    t.el = el;
  }
  function place(el, t) { el.style.setProperty('--r', t.r); el.style.setProperty('--c', t.c); }

  function spawn() {
    const free = [];
    for (let r = 0; r < 4; r++) for (let c = 0; c < 4; c++)
      if (!tiles.some(t => t.r === r && t.c === c)) free.push([r, c]);
    if (!free.length) return;
    const [r, c] = free[Math.floor(Math.random() * free.length)];
    const t = { id: nextId++, r, c, v: Math.random() < 0.9 ? 2 : 4 };
    tiles.push(t); addTile(t);
  }

  function newGame() {
    board.querySelectorAll('.tile').forEach(e => e.remove());
    tiles = []; score = 0; won = false; keepGoing = false; busy = false;
    scoreEl.textContent = 0; overlay.hidden = true;
    spawn(); spawn();
  }

  const VEC = { up: [-1, 0], down: [1, 0], left: [0, -1], right: [0, 1] };

  function move(dir) {
    if (busy || !overlay.hidden) return;
    const [dr, dc] = VEC[dir];
    const grid = Array.from({ length: 4 }, () => Array(4).fill(null));
    tiles.forEach(t => grid[t.r][t.c] = t);
    const rs = dr === 1 ? [3, 2, 1, 0] : [0, 1, 2, 3];
    const cs = dc === 1 ? [3, 2, 1, 0] : [0, 1, 2, 3];
    let moved = false;
    const merges = [];

    for (const r of rs) for (const c of cs) {
      const t = grid[r][c];
      if (!t) continue;
      let nr = r, nc = c, merged = false;
      while (true) {
        const tr = nr + dr, tc = nc + dc;
        if (tr < 0 || tr > 3 || tc < 0 || tc > 3) break;
        const o = grid[tr][tc];
        if (!o) { nr = tr; nc = tc; continue; }
        if (o.v === t.v && !o.justMerged) {
          grid[r][c] = null;
          t.r = tr; t.c = tc; t.dead = true;
          o.justMerged = true; o.newV = o.v * 2;
          score += o.newV;
          merges.push({ into: o, from: t });
          moved = merged = true;
        }
        break;
      }
      if (!merged && (nr !== r || nc !== c)) {
        grid[r][c] = null; grid[nr][nc] = t; t.r = nr; t.c = nc; moved = true;
      }
    }
    if (!moved) return;

    busy = true;
    tiles.forEach(t => { t.el.classList.remove('new', 'merged'); place(t.el, t); });
    scoreEl.textContent = score;
    if (score > best) { best = score; bestEl.textContent = best; try { localStorage.setItem('neon-2048-best', best); } catch {} }

    setTimeout(() => {
      merges.forEach(({ into, from }) => {
        from.el.remove();
        into.v = into.newV;
        into.el.className = cls(into.v) + ' merged';
        into.el.firstChild.textContent = into.v;
        if (into.v === 2048 && !won) won = true;
      });
      tiles = tiles.filter(t => !t.dead);
      tiles.forEach(t => { t.justMerged = false; delete t.newV; });
      spawn();
      busy = false;
      if (won && !keepGoing) show('win');
      else if (!canMove()) show('lose');
    }, 115);
  }

  function canMove() {
    if (tiles.length < 16) return true;
    const g = Array.from({ length: 4 }, () => Array(4).fill(0));
    tiles.forEach(t => g[t.r][t.c] = t.v);
    for (let r = 0; r < 4; r++) for (let c = 0; c < 4; c++)
      if ((c < 3 && g[r][c] === g[r][c + 1]) || (r < 3 && g[r][c] === g[r + 1][c])) return true;
    return false;
  }

  function show(kind) {
    overlay.className = 'overlay ' + kind;
    document.getElementById('ov-msg').textContent = kind === 'win' ? '2048! ✨' : 'game over';
    const btns = document.getElementById('ov-btns');
    btns.innerHTML = '';
    if (kind === 'win') {
      const k = document.createElement('button');
      k.textContent = 'keep going';
      k.onclick = () => { keepGoing = true; overlay.hidden = true; };
      btns.append(k, ' ');
    }
    const n = document.createElement('button');
    n.textContent = 'try again';
    n.onclick = newGame;
    btns.append(n);
    overlay.hidden = false;
  }

  const KEYS = {
    ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right',
    w: 'up', s: 'down', a: 'left', d: 'right', W: 'up', S: 'down', A: 'left', D: 'right'
  };
  document.addEventListener('keydown', e => {
    if (KEYS[e.key]) { e.preventDefault(); move(KEYS[e.key]); }
  });

  let sx, sy;
  document.addEventListener('touchstart', e => { sx = e.touches[0].clientX; sy = e.touches[0].clientY; }, { passive: true });
  document.addEventListener('touchend', e => {
    const dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy;
    if (Math.max(Math.abs(dx), Math.abs(dy)) < 24) return;
    move(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up'));
  }, { passive: true });

  document.getElementById('new').onclick = newGame;
  newGame();
  window.focus();
</script>
</body>
</html>
